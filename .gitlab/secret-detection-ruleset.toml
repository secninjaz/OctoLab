# Suppress known-resolved historical findings.
# A token was present in release.sh before commit 43c01844 removed it; it is revoked.
# Git history was subsequently rewritten (filter-repo) to replace it with REDACTED.
# The finding persists only in runner-cached pre-rewrite objects until cache pruning.
# Only a distinctive prefix is kept here: the allowlist matches it as a pattern.
[allowlist]
  description = "Revoked token removed from release.sh — history rewritten"
  [[allowlist.regexes]]
    description = "Expired PAT removed in 43c01844, history rewritten"
    regex = "glpat-EHEeDY_tpr"
